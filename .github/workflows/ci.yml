name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Secret scan (patterns phổ biến)
        run: |
          ! grep -rEn --exclude-dir=node_modules --exclude-dir=.next --exclude='*.log' '(sk_live_[A-Za-z0-9]+|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|xox[bap]-)' . || (echo "Phát hiện secret?" && exit 1)

      - name: Setup database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Seed database
        run: npx prisma db seed
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Bundle budget
        run: npm run check:bundle

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Setup database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Seed database
        run: npx prisma db seed
        env:
          DATABASE_URL: "file:./dev.db"

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: "file:./dev.db"
          PAYMENT_DEMO_MODE: "true"
          NEXT_PUBLIC_PAYMENT_DEMO_MODE: "true"

      - name: E2E tests
        run: npx playwright test
        env:
          PAYMENT_DEMO_MODE: "true"
          NEXT_PUBLIC_PAYMENT_DEMO_MODE: "true"

  # Phase 0.4: chứng minh schema + seed + query chạy trên Postgres thật.
  # Lưu ý: history migrations là SQLite-only nên prod dùng `db push` cho
  # lần deploy đầu (xem docs/runbook.md); job này khóa schema không trôi.
  postgres-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumina
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/lumina"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Switch provider to postgresql (CI only, không commit)
        run: sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma && npx prisma validate

      - name: Push schema to ephemeral Postgres
        run: npx prisma db push

      - name: Seed on Postgres
        run: npx prisma db seed

      - name: Smoke query (counts + search + hot index)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d lumina -c 'SELECT count(*) FROM "Product";' | grep -q "18"
          PGPASSWORD=postgres psql -h localhost -U postgres -d lumina -c 'SELECT count(*) FROM "Coupon";' | grep -q "3"
          PGPASSWORD=postgres psql -h localhost -U postgres -d lumina -c 'EXPLAIN SELECT * FROM "Order" WHERE status='"'"'pending'"'"' ORDER BY "createdAt" DESC LIMIT 20;' | grep -q "Order_status_idx"
